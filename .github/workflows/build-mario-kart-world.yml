# Build Mario Kart World IPA for iOS
# Requires: Game dump hosted at a direct-download URL (Google Drive, Dropbox, etc.)
# Outputs: MarioKartWorld.ipa (artifact), RomFS.img chunks (artifacts, reassemble locally)

name: Build Mario Kart World IPA

on:
  workflow_dispatch:
    inputs:
      game_dump_url:
        description: 'Direct download URL for the game dump folder (base/ with exefs/ and romfs/)'
        required: true
        type: string
      game_dump_sha256:
        description: 'SHA256 of the downloaded dump (for verification)'
        required: false
        type: string

permissions:
  contents: read
  actions: write  # For uploading artifacts

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
  GAME_TITLE_ID: 0400C3F00006E000
  GAME_FOLDER_NAME: "Mario Kart World"

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build IPA on macOS (Apple Silicon)
    runs-on: xcode-27
    timeout-minutes: 360  # 6 hours max

    steps:
      # ── Setup ──────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen

      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Install build dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install xcodegen zstd glslang
          brew install --cask dotnet-sdk

      - name: Setup Python and install packages
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/build_ipa_from_nsp.py

      - name: Install Python packages
        run: |
          python3 -m pip install lz4 "capstone>=5,<6" fonttools nsz zbic "backports.zstd; python_version < '3.14'"

      # ── Download Game Dump ─────────────────────────────────────────────────
      - name: Download game dump
        id: download
        env:
          GAME_DUMP_URL: ${{ github.event.inputs.game_dump_url }}
          GAME_DUMP_SHA256: ${{ github.event.inputs.game_dump_sha256 }}
        run: |
          set -euo pipefail
          echo "Downloading game dump from $GAME_DUMP_URL"

          # Create game folder
          mkdir -p "$HOME/Games"
          GAME_DIR="$HOME/Games/$GAME_FOLDER_NAME"
          mkdir -p "$GAME_DIR"

          # Download (supports Google Drive via gdown, direct links via curl/wget)
          if [[ "$GAME_DUMP_URL" == *"drive.google.com"* ]]; then
            echo "Detected Google Drive link, using gdown..."
            python3 -m pip install gdown
            # Extract file ID from various Google Drive URL formats
            FILE_ID=$(echo "$GAME_DUMP_URL" | grep -oE '[-\w]{25,}' | head -1)
            if [[ -z "$FILE_ID" ]]; then
              FILE_ID=$(echo "$GAME_DUMP_URL" | grep -oE 'id=[^&]+' | cut -d= -f2)
            fi
            if [[ -z "$FILE_ID" ]]; then
              echo "::error::Could not extract Google Drive file ID from URL"
              exit 1
            fi
            gdown --folder "https://drive.google.com/drive/folders/$FILE_ID" -O "$GAME_DIR"
          else
            echo "Downloading with curl..."
            # Assume it's a direct download of a tar.gz or zip
            ARCHIVE_PATH="$RUNNER_TEMP/game_dump.archive"
            curl -L --fail --retry 3 --retry-delay 10 -o "$ARCHIVE_PATH" "$GAME_DUMP_URL"

            # Verify SHA256 if provided
            if [[ -n "$GAME_DUMP_SHA256" ]]; then
              echo "Verifying SHA256..."
              DOWNLOADED_SHA256=$(sha256sum "$ARCHIVE_PATH" | cut -d' ' -f1)
              if [[ "$DOWNLOADED_SHA256" != "$GAME_DUMP_SHA256" ]]; then
                echo "::error::SHA256 mismatch! Expected $GAME_DUMP_SHA256, got $DOWNLOADED_SHA256"
                exit 1
              fi
              echo "SHA256 verified."
            fi

            # Extract based on extension
            echo "Extracting..."
            if [[ "$ARCHIVE_PATH" == *.tar.gz || "$ARCHIVE_PATH" == *.tgz ]]; then
              tar -xzf "$ARCHIVE_PATH" -C "$GAME_DIR" --strip-components=1
            elif [[ "$ARCHIVE_PATH" == *.zip ]]; then
              unzip -q "$ARCHIVE_PATH" -d "$GAME_DIR"
              # If extraction created a single subfolder, move contents up
              SUBDIRS=("$GAME_DIR"/*/)
              if [[ ${#SUBDIRS[@]} -eq 1 && -d "${SUBDIRS[0]}" ]]; then
                mv "${SUBDIRS[0]}"/* "$GAME_DIR"/
                rmdir "${SUBDIRS[0]}"
              fi
            else
              echo "::error::Unknown archive format. Use .tar.gz, .tgz, or .zip"
              exit 1
            fi
          fi

          # Verify structure
          echo "Verifying game dump structure..."
          REQUIRED_FILES=(
            "base/exefs/main"
            "base/exefs/main.npdm"
            "base/exefs/rtld"
            "base/exefs/sdk"
            "base/exefs/subsdk0"
            "base/romfs"
          )
          for f in "${REQUIRED_FILES[@]}"; do
            if [[ ! -e "$GAME_DIR/$f" ]]; then
              echo "::error::Missing required file: $f"
              ls -la "$GAME_DIR/base/exefs/" 2>/dev/null || true
              ls -la "$GAME_DIR/base/romfs/" 2>/dev/null | head -5 || true
              exit 1
            fi
          done

          # Verify build IDs
          echo "Verifying build IDs..."
          MAIN_BUILD_ID=$(xxd -s 0x40 -l 16 -p "$GAME_DIR/base/exefs/main" | tr -d '\n')
          SUBSDK0_BUILD_ID=$(xxd -s 0x40 -l 16 -p "$GAME_DIR/base/exefs/subsdk0" | tr -d '\n')
          SDK_BUILD_ID=$(xxd -s 0x40 -l 16 -p "$GAME_DIR/base/exefs/sdk" | tr -d '\n')

          echo "main build ID:      $MAIN_BUILD_ID"
          echo "subsdk0 build ID:  $SUBSDK0_BUILD_ID"
          echo "sdk build ID:      $SDK_BUILD_ID"

          EXPECTED_MAIN="9e244438c3d8ef1c703a6a85ef99c4f0"
          EXPECTED_SUBSDK0="d39a7a3d44530bb61b35690e5b0383d5"
          EXPECTED_SDK="90ebba182862b9ecdc21fcb87b999012"

          if [[ "$MAIN_BUILD_ID" != "$EXPECTED_MAIN" ]]; then
            echo "::warning::main build ID mismatch! Expected $EXPECTED_MAIN, got $MAIN_BUILD_ID"
          fi
          if [[ "$SUBSDK0_BUILD_ID" != "$EXPECTED_SUBSDK0" ]]; then
            echo "::warning::subsdk0 build ID mismatch! Expected $EXPECTED_SUBSDK0, got $SUBSDK0_BUILD_ID"
          fi
          if [[ "$SDK_BUILD_ID" != "$EXPECTED_SDK" ]]; then
            echo "::warning::sdk build ID mismatch! Expected $EXPECTED_SDK, got $SDK_BUILD_ID"
          fi

          echo "GAME_DIR=$GAME_DIR" >> $GITHUB_OUTPUT
          echo "Game dump verified at $GAME_DIR"

      # ── Build IPA ──────────────────────────────────────────────────────────
      - name: Build IPA (first build compiles ~11,561 shaders, 20-30 min)
        id: build
        env:
          GAME_DIR: ${{ steps.download.outputs.GAME_DIR }}
        run: |
          set -euo pipefail
          echo "Starting build at $(date)"
          echo "Game directory: $GAME_DIR"

          # Run the build script with --romfs separate to keep RomFS.img out of IPA
          # This makes IPA ~690 MB (fits in GitHub artifacts) and RomFS.img ~21.7 GB separate
          python3 scripts/build_ipa_from_nsp.py "$GAME_DIR" \
            --platform ios \
            --romfs separate \
            2>&1 | tee build.log

          # Find output files
          IPA_PATH=$(find "$GAME_DIR" -name "*.ipa" -type f | head -1)
          ROMFS_PATH=$(find "$GAME_DIR" -name "RomFS.img" -type f | head -1)

          if [[ -z "$IPA_PATH" || ! -f "$IPA_PATH" ]]; then
            echo "::error::IPA not found!"
            ls -la "$GAME_DIR"/
            exit 1
          fi

          echo "IPA_PATH=$IPA_PATH" >> $GITHUB_OUTPUT
          echo "ROMFS_PATH=$ROMFS_PATH" >> $GITHUB_OUTPUT

          IPA_SIZE=$(du -h "$IPA_PATH" | cut -f1)
          echo "IPA built: $IPA_PATH ($IPA_SIZE)"

          if [[ -n "$ROMFS_PATH" && -f "$ROMFS_PATH" ]]; then
            ROMFS_SIZE=$(du -h "$ROMFS_PATH" | cut -f1)
            echo "RomFS.img: $ROMFS_PATH ($ROMFS_SIZE)"
          else
            echo "::warning::RomFS.img not found at expected location"
          fi

          echo "Build completed at $(date)"

      # ── Upload IPA Artifact ────────────────────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: MarioKartWorld-ipa
          path: ${{ steps.build.outputs.IPA_PATH }}
          retention-days: 7
          compression-level: 6

      # ── Handle RomFS.img (split into 2GB chunks for GitHub artifact limits) ─
      - name: Split and upload RomFS.img chunks
        if: ${{ steps.build.outputs.ROMFS_PATH != '' }}
        env:
          ROMFS_PATH: ${{ steps.build.outputs.ROMFS_PATH }}
        run: |
          set -euo pipefail
          if [[ ! -f "$ROMFS_PATH" ]]; then
            echo "RomFS.img not found, skipping split"
            exit 0
          fi

          echo "Splitting RomFS.img into 2GB chunks..."
          SPLIT_DIR="$RUNNER_TEMP/romfs_chunks"
          mkdir -p "$SPLIT_DIR"

          # Split into 2GB chunks (1900M to be safe under 2GB limit)
          split -b 1900M -d -a 3 "$ROMFS_PATH" "$SPLIT_DIR/RomFS.img.part."

          CHUNK_COUNT=$(ls "$SPLIT_DIR" | wc -l)
          echo "Created $CHUNK_COUNT chunks"

          # Upload each chunk as separate artifact
          for i in $(seq -f "%03g" 0 $((CHUNK_COUNT - 1))); do
            CHUNK_FILE="$SPLIT_DIR/RomFS.img.part.$i"
            CHUNK_SIZE=$(du -h "$CHUNK_FILE" | cut -f1)
            echo "Uploading chunk $i ($CHUNK_SIZE)..."
            # Use a unique artifact name per chunk
            gh artifact upload "MarioKartWorld-romfs-part-$i" "$CHUNK_FILE" --retention-days=7 || true
          done

          # Also create a manifest for reassembly
          cat > "$SPLIT_DIR/MANIFEST.txt" <<EOF
Total chunks: $CHUNK_COUNT
Original file: RomFS.img
Split command: split -b 1900M -d -a 3 RomFS.img RomFS.img.part.
Reassembly: cat RomFS.img.part.* > RomFS.img
EOF
          gh artifact upload "MarioKartWorld-romfs-manifest" "$SPLIT_DIR/MANIFEST.txt" --retention-days=7 || true

      # ── Summary ────────────────────────────────────────────────────────────
      - name: Build summary
        run: |
          echo "## Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**IPA:** \`MarioKartWorld.ipa\` (download from artifacts)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**RomFS.img:** Split into 2GB chunks (download all parts from artifacts)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Download \`MarioKartWorld-ipa\` artifact" >> $GITHUB_STEP_SUMMARY
          echo "2. Download all \`MarioKartWorld-romfs-part-*\` artifacts" >> $GITHUB_STEP_SUMMARY
          echo "3. Reassemble RomFS.img: \`cat RomFS.img.part.* > RomFS.img\`" >> $GITHUB_STEP_SUMMARY
          echo "4. Install IPA via LiveContainer on iPhone" >> $GITHUB_STEP_SUMMARY
          echo "5. Copy RomFS.img to LiveContainer Documents folder" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See [TUTORIAL.md](TUTORIAL.md) for detailed instructions."

  # Alternative: Upload RomFS.img to file hosting (if user provides credentials)
  # upload-romfs:
  #   name: Upload RomFS.img to cloud storage
  #   needs: build
  #   if: false  # Set to true and configure secrets to enable
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Download RomFS chunks
  #       uses: actions/download-artifact@...
  #     - name: Reassemble and upload to...
  #       run: ...